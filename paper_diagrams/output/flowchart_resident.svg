937">reports, report community</text><text x="610" y="1445.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">issues, or edit the profile</text><rect x="460" y="1517" width="300" height="66" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="610" y="1545.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Save it, give a tracking code,</text><text x="610" y="1565.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">and send the notices</text><rect x="460" y="1637" width="300" height="66" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="610" y="1665.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Track the request and read the</text><text x="610" y="1685.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">notices</text><rect x="460" y="1749" width="300" height="62" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="610" y="1785.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Sign out</text><rect x="535" y="1849" width="150" height="46" rx="23" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="610" y="1877.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">End</text></svg>