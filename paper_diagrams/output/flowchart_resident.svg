 y="540.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Enter the email or mobile</text><text x="610" y="560.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">number and the password</text><polygon points="610,626 745,690 610,754 475,690" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="610" y="675.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Is sign-in paused</text><text x="610" y="695.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">for this email or</text><text x="610" y="715.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">number?</text><rect x="885" y="647" width="300" height="86" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="1035" y="675.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Show the wait time: sign-in is</text><text x="1035" y="695.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">paused for 15 minutes after 5</text><text x="1035" y="715.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">wrong tries</text><polygon points="610,781 745,845 610,909 475,845" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="610" y="840.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Is the password</text><text x="610" y="860.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">correct?</text><rect x="885" y="812" width="300" height="66" rx="2" fill="