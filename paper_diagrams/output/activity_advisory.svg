round"/><polygon points="283.95,1181 290,1192 296.05,1181" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="815" y="1150.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F3A5F">[SMS mode: manual]</text><rect x="170" y="1321" width="850" height="8" fill="#1F3A5F"/><polyline points="640,1148 640,1321" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="633.95,1310 640,1321 646.05,1310" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="960,1268 960,1321" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="953.95,1310 960,1321 966.05,1310" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="230,1258 230,1321" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="223.95,1310 230,1321 236.05,1310" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1020,1325 1345,1325 1345,1382" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1338.95,1371 1345,1382 1351.05,1371" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1345,1468 1345,1520" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1338.95,1509 1345,1520 1351.05,1509" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><rect x="80" y="1400" width="600" height="74.6" rx="2" fill="#FFFDF2" stroke="#1F3A5F" stroke-width="1.3" stroke-dasharray="6 4"/><text x="380" y="1424.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">A live advisory that is not confirmed as still accurate within 24 hours is</text><text x="380" y="1441.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">flagged for staff review. Advisories stay active until staff deactivate</text><text x="380" y="1459.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">them.</text><circle cx="640" cy="85" r="14" fill="#1F3A5F"/><rect x="500" y="132" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="640" y="160.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Read PAGASA, PHIVOLCS, GDACS,</text><text x="640" y="180.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">USGS, and Open-Meteo when a</text><text x="640" y="200.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">page is opened or on schedule</text><rect x="500" y="247" width="280" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="640" y="275.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Record a serious reading: a</text><text x="640" y="295.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Cavite wind signal, a nearby</text><text x="640" y="315.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">earthquake, a strong storm, or</text><text x="640" y="335.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">heavy rain</text><polygon points="640,385 660,405 640,425 620,405" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="820" y="372" width="280" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="960" y="400.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Show the readings on the</text><text x="960" y="420.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">hazard cards only</text><circle cx="960" cy="480" r="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><polyline points="950,470 970,490" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linejoin="round"/><polyline points="950,490 970,470" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linejoin="round"/><rect x="500" y="507" width="280" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="640" y="535.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Publish the advisory as the</text><text x="640" y="555.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">system</text><circle cx="230" cy="85" r="14" fill="#1F3A5F"/><rect x="90" y="132" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="230" y="160.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Write an advisory, from a</text><text x="230" y="180.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">template if needed, with an</text><text x="230" y="200.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">optional Filipino version</text><rect x="90" y="362" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="230" y="390.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Review the detection and open</text><text x="230" y="410.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">the advisory form filled in</text><text x="230" y="430.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">from it</text><polygon points="230,500 250,520 230,540 210,520" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="90" y="577" width="280" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="230" y="605.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Save the advisory as live or</text><text x="230" y="625.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">as practice</text><rect x="820" y="577" width="280" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="960" y="605.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Check for blanks such as</text><text x="960" y="625.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">{AREAS} left unfilled</text><polygon points="960,685 980,705 960,725 940,705" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="90" y="674" width="280" height="62" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="230" y="710.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Fill in the blanks</text><polygon points="960,780 980,800 960,820 940,800" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="820" y="857" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="960" y="885.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Show it to staff only; text</text><text x="960" y="905.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">verified staff mobiles and</text><text x="960" y="925.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">push to staff devices</text><circle cx="960" cy="990" r="15" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><circle cx="960" cy="990" r="9" fill="#1F3A5F"/><polygon points="640,780 660,800 640,820 620,800" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="500" y="867" width="280" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="640" y="895.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Show it on the public pages</text><text x="640" y="915.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">and the offline emergency page</text><rect x="500" y="1082" width="280" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="640" y="1110.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Send device alerts (once per</text><text x="640" y="1130.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">alert level)</text><polygon points="960,1095 980,1115 960,1135 940,1115" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="820" y="1182" width="280" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="960" y="1210.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Text every Active resident in</text><text x="960" y="1230.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">their chosen language (once</text><text x="960" y="1250.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">per alert level)</text><rect x="90" y="1192" width="280" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="230" y="1220.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Send an SMS from the</text><text x="230" y="1240.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">dispatcher if needed</text><rect x="1210" y="1382" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="1345" y="1410.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Receive the advisory on the</text><text x="1345" y="1430.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">website, the emergency page,</text><text x="1345" y="1450.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">by SMS, or as a device alert</text><circle cx="1345" cy="1535" r="15" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><circle cx="1345" cy="1535" r="9" fill="#1F3A5F"/></svg>