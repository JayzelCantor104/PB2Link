<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1700" viewBox="0 0 1380 1700"><rect width="1380" height="1700" fill="#FFFFFF"/><rect x="470" y="20" width="440" height="1650" rx="0" fill="#E8EEF6" stroke="#E8EEF6" stroke-width="0"/><rect x="30" y="20" width="1320" height="1650" rx="0" fill="none" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="470,20 470,1670" fill="none" stroke="#1F3A5F" stroke-width="1.2" stroke-linejoin="round"/><polyline points="910,20 910,1670" fill="none" stroke="#1F3A5F" stroke-width="1.2" stroke-linejoin="round"/><rect x="30" y="20" width="1320" height="38" rx="0" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="44.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Resident</text><text x="690" y="44.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">PB2Link website</text><text x="1130" y="44.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Barangay staff</text><polyline points="250,95 250,127" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="243.95,116 250,127 256.05,116" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="385,170 555,170" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="544,176.05 555,170 544,163.95" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="690,213 690,260" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="683.95,249 690,260 696.05,249" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="670,280 385,280" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="396,273.95 385,280 396,286.05" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="660" y="270.6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#1F3A5F">[one is nearby]</text><polyline points="250,323 250,367" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="243.95,356 250,367 256.05,356" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="690,300 690,345 340,345 340,367" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="333.95,356 340,367 346.05,356" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="702" y="319.6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F3A5F">[none nearby]</text><polyline points="385,420 555,420" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="544,426.05 555,420 544,413.95" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="690,473 690,515" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="683.95,504 690,515 696.05,504" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="670,535 385,535" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="396,528.95 385,535 396,541.05" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="660" y="500.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#1F3A5F">[blocked: phone, email,</text><text x="660" y="518.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#1F3A5F">or offensive word]</text><polyline points="115,535 62,535 62,420 115,420" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="104,426.05 115,420 104,413.95" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="690,555 690,597" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="683.95,586 690,597 696.05,586" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="702" y="574.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F3A5F">[passes]</text><polyline points="690,683 690,725" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="683.95,714 690,725 696.05,714" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="710,745 995,745" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="984,751.05 995,745 984,738.95" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="720" y="710.8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F3A5F">[held: may name a person,</text><text x="720" y="728.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F3A5F">or review mode is on]</text><polyline points="1130,776 1130,830" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1123.95,819 1130,830 1136.05,819" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1130,870 1130,917" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1123.95,906 1130,917 1136.05,906" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="1142" y="889.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F3A5F">[don’t post]</text><polyline points="1130,1003 1130,1030" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1123.95,1019 1130,1030 1136.05,1019" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1110,850 760,850 760,917" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="753.95,906 760,917 766.05,906" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="1100" y="840.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#1F3A5F">[post it]</text><polyline points="690,765 690,917" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="683.95,906 690,917 696.05,906" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="678" y="784.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#1F3A5F">[live]</text><polyline points="690,1003 690,1090 1130,1090 1130,1097" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1123.95,1086 1130,1097 1136.05,1086" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1130,1203 1130,1280 825,1280" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="836,1273.95 825,1280 836,1286.05" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="690,1333 690,1410 385,1410" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="396,1403.95 385,1410 396,1416.05" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="250,1443 250,1485" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="243.95,1474 250,1485 256.05,1474" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><rect x="70" y="1000" width="360" height="111" rx="2" fill="#FFFDF2" stroke="#1F3A5F" stroke-width="1.3" stroke-dasharray="6 4"/><text x="250" y="1025.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">Residents’ names are never shown on the</text><text x="250" y="1042.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">public map. Other residents may report a</text><text x="250" y="1060.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">comment; three reports hide it until staff</text><text x="250" y="1077.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">check it. Staff may also merge a duplicate</text><text x="250" y="1095.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">pin or pause a resident’s posting.</text><circle cx="250" cy="80" r="14" fill="#1F3A5F"/><rect x="115" y="127" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="155.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Tap a spot inside the</text><text x="250" y="175.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">barangay, or use the current</text><text x="250" y="195.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">location, and pick a category</text><rect x="555" y="127" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="155.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Look for an open issue of the</text><text x="690" y="175.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">same category within 30</text><text x="690" y="195.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">meters</text><polygon points="690,260 710,280 690,300 670,280" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="115" y="237" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="265.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Add a report to that issue,</text><text x="250" y="285.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">or confirm that it is a new</text><text x="250" y="305.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">problem</text><rect x="115" y="367" width="270" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="395.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Write a comment, add a</text><text x="250" y="415.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">landmark or photo if wanted,</text><text x="250" y="435.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">and agree to the posting</text><text x="250" y="455.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">rules</text><rect x="555" y="367" width="270" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="395.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Check the account (Active,</text><text x="690" y="415.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">not paused), the boundary,</text><text x="690" y="435.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">the limit of 5 new pins a</text><text x="690" y="455.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">day, and screen the text</text><polygon points="690,515 710,535 690,555 670,535" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="115" y="502" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="530.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Read the message and edit the</text><text x="250" y="550.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">text</text><rect x="555" y="597" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="625.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Save the report; a held</text><text x="690" y="645.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">report is not public and not</text><text x="690" y="665.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">counted yet</text><polygon points="690,725 710,745 690,765 670,745" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="995" y="714" width="270" height="62" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="1130" y="750.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Check the held report</text><polygon points="1130,830 1150,850 1130,870 1110,850" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="995" y="917" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="1130" y="945.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Keep it off the map, record</text><text x="1130" y="965.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">the reason, and email the</text><text x="1130" y="985.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">resident</text><circle cx="1130" cy="1045" r="15" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><circle cx="1130" cy="1045" r="9" fill="#1F3A5F"/><rect x="555" y="917" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="945.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Show the flag on the map; its</text><text x="690" y="965.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">color follows the number of</text><text x="690" y="985.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">live reports</text><rect x="995" y="1097" width="270" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="1130" y="1125.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Update the status</text><text x="1130" y="1145.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">(Acknowledged, In Progress,</text><text x="1130" y="1165.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Resolved, or Rejected) with a</text><text x="1130" y="1185.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">public remark</text><rect x="555" y="1227" width="270" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="1255.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Add the update to the public</text><text x="690" y="1275.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">timeline and notify the</text><text x="690" y="1295.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">reporters (SMS only when</text><text x="690" y="1315.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Resolved)</text><rect x="115" y="1377" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="1405.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">See the status and the staff</text><text x="250" y="1425.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">updates on the map</text><circle cx="250" cy="1500" r="15" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><circle cx="250" cy="1500" r="9" fill="#1F3A5F"/></svg>