/><text x="1130" y="1505.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Mark the booking Completed</text><text x="1130" y="1525.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">(or extend its end time for</text><text x="1130" y="1545.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">overtime)</text><circle cx="1130" cy="1610" r="15" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><circle cx="1130" cy="1610" r="9" fill="#1F3A5F"/></svg>