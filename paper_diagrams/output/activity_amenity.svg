t</text><text x="690" y="185.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">date</text><polygon points="690,240 710,260 690,280 670,260" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="115" y="227" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="255.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Call the hotline number shown</text><text x="250" y="275.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">(ambulance)</text><circle cx="250" cy="345" r="15" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><circle cx="250" cy="345" r="9" fill="#1F3A5F"/><rect x="115" y="377" width="270" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="405.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Enter the time (venue or</text><text x="250" y="425.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">vehicle) or the quantity</text><text x="250" y="445.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">(equipment), the purpose, and</text><text x="250" y="465.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">the destination of a vehicle</text><rect x="555" y="377" width="270" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="405.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Check the date (today up to</text><text x="690" y="425.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">180 days ahead), the opening</text><text x="690" y="445.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">hours, and the limit of 2</text><text x="690" y="465.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">active bookings</text><polygon points="690,520 710,540 690,560 670,540" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="115" y="592" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="620.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Read the reason and change</text><text x="250" y="640.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">the details</text><rect x="555" y="587" width="270" height="106" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="615.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Lock the amenity, then check</text><text x="690" y="635.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">for a time overlap (venue,</text><text x="690" y="655.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">vehicle) or the units left</text><text x="690" y="675.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">(equipment)</text><polygon points="690,730 710,750 690,770 670,750" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect x="115" y="717" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="250" y="745.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Read the times or units</text><text x="250" y="765.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">already taken</text><rect x="555" y="817" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="845.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Save the booking as Pending</text><text x="690" y="865.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">with a tracking code</text><rect x="555" y="947" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="690" y="975.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Notify the resident by their</text><text x="690" y="995.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">chosen channel</text><circle cx="690" cy="1060" r="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/><polyline points="680,1050 700,1070" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linejoin="round"/><polyline points="680,1070 700,1050" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linejoin="round"/><rect x="995" y="947" width="270" height="66" rx="18" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="1130" y="975.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Review the booking on the</text><text x="1130" y="995.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">calendar</text><polygon points="1130,1070 1150,1090 1130,1110 1110,1090" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><rect 