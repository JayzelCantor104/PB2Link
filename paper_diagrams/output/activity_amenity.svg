" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="690,1013 690,1045" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="683.95,1034 690,1045 696.05,1034" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1130,1013 1130,1070" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1123.95,1059 1130,1070 1136.05,1059" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1110,1090 750,1090 750,1147" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="743.95,1136 750,1147 756.05,1136" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="1100" y="1080.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#1F3A5F">[decline with a remark]</text><polyline points="690,1213 690,1250" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="683.95,1239 690,1250 696.05,1239" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="1130,1110 1130,1159" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1123.95,1148 1130,1159 1136.05,1148" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="1142" y="1129.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F3A5F">[approve]</text><polyline points="1130,1221 1130,1330 825,1330" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="836,1323.95 825,1330 836,1336.05" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="690,1373 690,1430 385,1430" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="396,1423.95 385,1430 396,1436.05" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="250,1463 250,1520 995,1520" fill=