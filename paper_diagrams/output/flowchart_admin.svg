e" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,556 430,567 436.05,556" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="430,693 430,722" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,711 430,722 436.05,711" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="442" y="539.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3A5F">Yes</text><polyline points="430,808 430,854" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,843 430,854 436.05,843" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="430,916 430,951" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,940 430,951 436.05,940" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="565,1015 710,1015" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="699,1021.05 710,1015 699,1008.95" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="577" y="1005.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3A5F">No</text><polyline points="860,972 860,765 580,765" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="591,758.95 580,765 591,771.05" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="430,1079 430,1132" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,1121 430,1132 436.05,1121" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="442" y="1099.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3A5F">Yes</text><polyline points="430,1198 430,1247" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,1236 430,1247 436.05,1236" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="430,1333 430,1376" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,1365 430,1376 436.05,1365" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><polyline points="295,1440 95,1440 95,885 280,885" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="269,891.05 280,885 269,878.95" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="283" y="1430.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#1F3A5F">Yes</text><polyline points="430,1504 430,1554" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,1543 430,1554 436.05,1543" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="442" y="1524.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3A5F">No</text><polyline points="430,1616 430,1652" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="423.95,1641 430,1652 436.05,1641" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><rect x="700" y="1140" width="360" height="111" rx="2" fill="#FFFDF2" stroke="#1F3A5F" stroke-width="1.3" stroke-dasharray="6 4"/><text x="880" y="1165.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">Super Admin: every tab, plus Manage Admins,</text><text x="880" y="1182.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">the Audit Log, and the system settings.</text><text x="880" y="1200.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">Standard Admin: the standard access, plus</text><text x="880" y="1217.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">what their position adds, with Allow or Deny</text><text x="880" y="1235.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#374151">set for each admin (Deny wins).</text><polyline points="700,1195.5 640,1195.5 565,1045" fill="none" stroke="#1F3A5F" stroke-width="1.3" stroke-dasharray="6 4" stroke-linejoin="round"/><rect x="355" y="22" width="150" height="46" rx="23" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="50.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Start</text><polygon points="306,102 580,102 554,188 280,188" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="130.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Open the admin sign-in page</text><text x="430" y="150.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">and enter the email and</text><text x="430" y="170.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">password</text><polygon points="430,236 565,300 430,364 295,300" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="295.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Is this email</text><text x="430" y="315.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">paused?</text><rect x="710" y="257" width="300" height="86" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="860" y="285.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Show the wait time; record the</text><text x="860" y="305.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">pause in the audit log and email</text><text x="860" y="325.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">the admin</text><polygon points="430,391 565,455 430,519 295,455" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="450.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Is the password</text><text x="430" y="470.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">correct?</text><rect x="710" y="422" width="300" height="66" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="860" y="450.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Count the failed try and record</text><text x="860" y="470.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">it in the audit log</text><polygon points="306,567 580,567 554,693 280,693" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="595.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Enter the one-time code</text><text x="430" y="615.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">sent by email or SMS,</text><text x="430" y="635.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">unless two-step sign-in is</text><text x="430" y="655.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">off or the device is</text><text x="430" y="675.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">remembered</text><rect x="280" y="722" width="300" height="86" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="750.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Open the Dashboard with the</text><text x="430" y="770.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">counts and tasks of the tabs</text><text x="430" y="790.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">this admin may open</text><rect x="280" y="854" width="300" height="62" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="890.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Open a tab</text><polygon points="430,951 565,1015 430,1079 295,1015" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="1010.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Is this tab allowed</text><text x="430" y="1030.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">for this admin?</text><rect x="710" y="972" width="300" height="86" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="860" y="1000.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Show "no access"; the server</text><text x="860" y="1020.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">refuses the data and records the</text><text x="860" y="1040.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">attempt</text><rect x="280" y="1132" width="300" height="66" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="1160.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Review, approve, update, or</text><text x="430" y="1180.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">publish in the module</text><rect x="280" y="1247" width="300" height="86" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="1275.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Save the change, notify the</text><text x="430" y="1295.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">resident when needed, and record</text><text x="430" y="1315.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">it in the audit log</text><polygon points="430,1376 565,1440 430,1504 295,1440" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="1445.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">More work?</text><rect x="280" y="1554" width="300" height="62" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="1590.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1F2937">Sign out</text><rect x="355" y="1652" width="150" height="46" rx="23" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.6"/><text x="430" y="1680.2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">End</text></svg>